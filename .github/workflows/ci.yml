name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      - name: Unit and smoke tests (default profile, every feature on)
        run: zig build test --summary all
      - name: Every preset and edge flag combination
        run: zig build test-flags --summary all
      # dusty's own suite on the TLS (BoringSSL), nghttp2, zlib-ng and zstd
      # Anole injects into it.
      - name: dusty's tests on Anole's seams
        run: zig build dusty-test --summary all
      # test-flags shares one full-profile configure, so it cannot catch a
      # feature that reads a C module its own flags never requested. These
      # configure each profile on its own, as a user would.
      - name: Profile minimal (no C library besides llhttp)
        run: zig build test -Dprofile=minimal --summary all
      - name: Profile web (BoringSSL + nghttp2, no HTTP/3)
        run: zig build test -Dprofile=web --summary all
      - name: Full profile without TLS (turns HTTP/3 off)
        run: zig build test -Dtls=none --summary all
      - name: HTTP/3 without HTTP/2 (nghttp3 without nghttp2)
        run: zig build test -Dhttp2=false -Dhttp3=true --summary all
      - name: Invalid flag combination is rejected
        shell: bash
        run: |
          if out=$(zig build -Dtls=none -Dhttp3=true 2>&1); then
            echo "expected -Dtls=none -Dhttp3=true to fail, but the build succeeded"
            exit 1
          fi
          echo "$out"
          grep -F "invalid Anole feature flags" <<<"$out"

  cross:
    name: cross (aarch64-linux-gnu, compile and link only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: cross-aarch64-linux-gnu
      - name: Build every test binary and the hello example
        run: zig build test-flags hello -Dtarget=aarch64-linux-gnu --summary all

  h2spec:
    name: h2spec (HTTP/2 conformance, h2c and TLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: h2spec
      - name: Build examples/hello
        run: zig build hello -Doptimize=ReleaseSafe --summary all
      - name: Fetch h2spec 2.6.0, pinned by SHA-256
        run: |
          curl -fsSL -o h2spec.tar.gz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  h2spec.tar.gz" | sha256sum -c -
          tar xzf h2spec.tar.gz h2spec
      # Fails on any failure not in tests/h2spec/known-failures.txt, on a
      # listed case that now passes, and if the server dies.
      - name: h2spec over h2c and over TLS
        run: tests/h2spec/run.sh ./h2spec ./zig-out/bin/hello

  autobahn:
    name: Autobahn (WebSocket conformance, HTTP/1.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: autobahn
      - name: Build the echo peer
        run: zig build autobahn-echo -Doptimize=ReleaseSafe --summary all
      # The fuzzing client in Docker (image pinned by digest); fails on any
      # case that is not OK, NON-STRICT or INFORMATIONAL.
      - name: Autobahn fuzzing client
        run: tests/autobahn/run.sh ./zig-out/bin/autobahn-echo

  h3:
    name: HTTP/3 server and client against aioquic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: h3
      # Debug, so the debug allocator reports any leak at exit.
      - name: Build the HTTP/3 test server and client
        run: zig build h3-test-server h3-test-client --summary all
      - name: Server and client against aioquic
        run: tests/h3/run.sh ./zig-out/bin/h3-test-server ./zig-out/bin/h3-test-client

  quic-interop:
    name: QUIC interop runner (Anole's server, ngtcp2 and quic-go clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: quic-interop
      # The runner reads its traces with pyshark; it needs a current tshark
      # (its own CI uses this PPA).
      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/nightly
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends tshark
      - name: tests/interop/run.sh
        run: tests/interop/run.sh ngtcp2,quic-go
        env:
          ANOLE_INTEROP_WORK: ${{ runner.temp }}/interop
      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quic-interop-logs
          path: ${{ runner.temp }}/interop/logs
          retention-days: 7

  fuzz:
    name: Fuzz the parsers (200K runs per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: fuzz
      # The fuzz targets are the "fuzz:" tests (src/fuzz.zig); a plain
      # `zig build test` runs them on their seeds and fixed mutations only.
      - name: zig build test --fuzz=200K
        run: zig build test -Dllvm=true --fuzz=200K

  grpc-interop:
    name: gRPC interop (both directions with grpc-go, cleartext HTTP/2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: grpc-interop
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build the interop server
        run: zig build grpc-interop-server -Doptimize=ReleaseSafe --summary all
      # grpc-go's interop client (v1.84.0), one test case at a time.
      - name: Build the interop client
        run: zig build grpc-interop-client -Doptimize=ReleaseSafe --summary all
      - name: Interop test cases (grpc-go client, Anole server)
        run: tests/grpc/interop/run.sh ./zig-out/bin/grpc-interop-server
      - name: Interop test cases (Anole client, grpc-go server)
        run: tests/grpc/interop/run-client.sh ./zig-out/bin/grpc-interop-client

  redis:
    name: Redis and Valkey (live client and session store tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7", "valkey/valkey:8"]
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          cache-key: redis
      - name: Tests with a live server
        run: zig build test -Dredis-test-port=6379 --summary all
