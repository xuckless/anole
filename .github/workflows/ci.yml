name: CI

# Changes to docs alone (guides, README, CHANGELOG, the site, issue
# templates) skip this suite: the Docs site workflow builds and link-checks
# them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - "LICENSE*"

permissions:
  contents: read

# Time limits: every job and every long step has `timeout-minutes`, at least
# ceil(2 x p95) + 5 from the last 30 green runs (2026-10-28; review them each
# release), never below the limit a step had before (cold caches), so a hang
# costs minutes. Every unit test step passes
# `--test-timeout 120s`: a test running that long is named and ended, and the
# test runner dumps every thread's backtrace at 110 s (gdb on Linux; lldb,
# else sample, on macOS; src/safety/test_runner.zig). Jobs with Docker
# containers save the containers' logs and states as an artifact when they
# fail: their scripts keep the containers (named anole-*) under
# ANOLE_KEEP_CONTAINERS=1 and an always() step removes them afterwards. The
# interop runners own their containers (docker compose); each test's
# output.txt in their uploaded logs holds every container's output, and the
# containers of the last test are still there for the artifact.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # zig fmt over everything but the generated gRPC code; no dependency
    # fetch, so this fails in seconds (S1.5, research/s15/small-fixes.md).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: zig fmt --check
        run: zig fmt --check build.zig build.zig.zon build src tests examples tools templates bench --exclude tests/grpc/gen --exclude examples/grpc/gen

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: ./.github/actions/install-gdb
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Unit and smoke tests (default profile, every feature on)
        timeout-minutes: 36
        run: zig build test --test-timeout 120s --summary all
      # test-flags shares one full-profile configure, so it cannot catch a
      # feature that reads a C module its own flags never requested. These
      # configure each profile on its own, as a user would.
      - name: Profile minimal (no C library besides llhttp)
        timeout-minutes: 15
        run: zig build test -Dprofile=minimal --test-timeout 120s --summary all
      - name: Profile web (BoringSSL + nghttp2, no HTTP/3)
        timeout-minutes: 23
        run: zig build test -Dprofile=web --test-timeout 120s --summary all
      - name: Full profile without TLS (turns HTTP/3 off)
        timeout-minutes: 20
        run: zig build test -Dtls=none --test-timeout 120s --summary all
      - name: HTTP/3 without HTTP/2 (nghttp3 without nghttp2)
        timeout-minutes: 31
        run: zig build test -Dhttp2=false -Dhttp3=true --test-timeout 120s --summary all
      - name: Invalid flag combination is rejected
        shell: bash
        run: |
          if out=$(zig build -Dtls=none -Dhttp3=true 2>&1); then
            echo "expected -Dtls=none -Dhttp3=true to fail, but the build succeeded"
            exit 1
          fi
          echo "$out"
          grep -F "invalid Anole feature flags" <<<"$out"
      # `anole console` and the in-process console (`c` + Enter) driven in a
      # real pseudo-terminal: keys reach the TUI, every way out restores
      # the terminal. (macOS: poll(2) cannot wait on /dev/tty.)
      - name: Live console in a pseudo-terminal
        timeout-minutes: 10
        run: |
          zig build cli rest --summary all
          python3 -I tests/console/pty_test.py zig-out/bin/anole zig-out/bin/rest

  # Every preset and edge flag combination, a third of them per job: the
  # twelve full suites one after another outgrew one step's time on the
  # macOS runner.
  flags:
    name: test-flags (${{ matrix.os }}, ${{ matrix.group.name }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group:
          - { name: full, combos: "full,full-no-compression,full-tls-none,minimal" }
          - { name: trimmed, combos: "full-no-brotli,full-no-openapi,db-none,db-only" }
          - { name: subsets, combos: "brokers-none,http2-no-grpc,web,minimal-no-lambda" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: flags-${{ matrix.group.name }}
      - uses: ./.github/actions/install-gdb
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Preset and edge flag combinations (${{ matrix.group.combos }})
        timeout-minutes: 47
        run: zig build test-flags -Dflags-combos=${{ matrix.group.combos }} --test-timeout 120s --summary all

  cross:
    name: cross (${{ matrix.target }}, compile and link only)
    strategy:
      fail-fast: false
      matrix:
        # x86_64-windows: every preset and edge combination, which the
        # windows job (default profile only) does not build.
        target: [aarch64-linux-gnu, x86_64-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: cross-${{ matrix.target }}
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Build every test binary and the full example
        timeout-minutes: 72
        run: zig build test-flags full -Dtarget=${{ matrix.target }} --summary all

  capi:
    name: capi (${{ matrix.os }})
    # libanole, the C ABI (include/anole.h): packed with Zig alone, its
    # exported symbols checked, anole.h's layout against the Zig side, the C
    # suite plain and under ASan and UBSan; on Linux also the header and the
    # Zig side of libanole for Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: capi
      - uses: ./.github/actions/install-gdb
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: libanole (static and shared, only anole_* exported)
        timeout-minutes: 27
        run: zig build capi --summary all
      - name: anole.h layout, the C suite, the engine over HTTP/2 and HTTP/3
        timeout-minutes: 20
        run: zig build capi-test test-capi-engine --test-timeout 120s --summary all
      - name: The C suite under ASan and UBSan (system cc)
        timeout-minutes: 20
        run: zig build capi-test-asan --test-timeout 120s --summary all
      - name: The same, against a ReleaseSafe libanole
        timeout-minutes: 22
        run: zig build capi-test -Doptimize=ReleaseSafe --test-timeout 120s --summary all
      - name: anole.h and the Zig side of libanole for Windows
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          for t in x86_64-windows-gnu aarch64-windows-gnu; do
            zig cc -target $t -std=c99 -Wall -Wextra -Werror -Iinclude -c tests/capi/layout.c -o /tmp/layout-$t.o
            zig c++ -target $t -std=c++17 -Wall -Werror -Iinclude -x c++ -c tests/capi/layout.c -o /tmp/layout-$t-cxx.o
          done
          zig build capi-zig capi -Dtarget=x86_64-windows-gnu --summary all

  windows:
    name: windows (development target; default profile)
    runs-on: windows-latest
    # Windows is a development target ("works on Windows, fast on Linux"):
    # the tests run, the examples build and two of them serve requests. The
    # Unix-only parts (per-core SO_REUSEPORT sockets, HTTP/3 steering and
    # UDP batching, listener hand-off and SIGUSR2, LISTEN_FDS, sd_notify,
    # idle parking) are compiled out there and their tests skipped.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    # Strawberry Perl's pkg-config.bat is on the runner's PATH and fails
    # when Zig asks it about the Windows system libraries (advapi32 for
    # translate-c): with no pkg-config, Zig links them directly.
    env:
      PKG_CONFIG: anole-no-pkg-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: windows
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Unit and smoke tests (default profile, every feature on)
        timeout-minutes: 60
        run: zig build test --test-timeout 120s --summary all
      - name: Build and install the examples
        timeout-minutes: 20
        run: zig build hello rest websocket grpc auth clients observe postgres sqlite mongodb redis io full --summary all
      # Two examples serve requests: hello over HTTP/1.1, and full (every
      # listener, `process` set, so the Unix-only hand-off is skipped)
      # over HTTP/1.1, HTTPS, and h2c and HTTP/2 over TLS when a curl with
      # HTTP/2 is on the runner (Git for Windows' is built without it; the
      # h2 client tests above cover HTTP/2 either way). Ctrl-C would drain
      # them, but a runner has no console to send one to, so they are killed.
      - name: examples/hello and examples/full answer requests
        timeout-minutes: 6
        run: |
          h2curl=
          for c in curl /c/Windows/System32/curl.exe; do
            if "$c" -V 2>/dev/null | grep -q '^Features:.* HTTP2'; then h2curl=$c; break; fi
          done
          get() {
            for i in $(seq 1 50); do
              if "$@"; then echo; return 0; fi
              sleep 0.2
            done
            return 1
          }
          ok=0
          ./zig-out/bin/hello.exe > hello.log 2>&1 &
          hello=$!
          get curl -fsS http://127.0.0.1:3000/ || ok=1
          kill $hello || true
          ./zig-out/bin/full.exe > full.log 2>&1 &
          full=$!
          get curl -fsS http://127.0.0.1:8080/ || ok=1
          get curl -fsSk https://127.0.0.1:8443/ || ok=1
          if [ -n "$h2curl" ]; then
            get "$h2curl" -fsS --http2-prior-knowledge http://127.0.0.1:8080/ -w ' (HTTP/%{http_version})' || ok=1
            get "$h2curl" -fsSk --http2 https://127.0.0.1:8443/ -w ' (HTTP/%{http_version})' || ok=1
          else
            echo "no curl with HTTP/2 here: h2c and h2 over TLS not checked from outside"
          fi
          kill $full || true
          echo "--- hello.log"; cat hello.log
          echo "--- full.log"; cat full.log
          exit $ok

  h2spec:
    name: h2spec (HTTP/2 conformance, h2c and TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: h2spec
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Build examples/full
        timeout-minutes: 20
        run: zig build full -Doptimize=ReleaseSafe --summary all
      - name: Fetch h2spec 2.6.0, pinned by SHA-256
        run: |
          curl -fsSL -o h2spec.tar.gz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  h2spec.tar.gz" | sha256sum -c -
          tar xzf h2spec.tar.gz h2spec
      # Fails on any failure not in tests/h2spec/known-failures.txt, on a
      # listed case that now passes, and if the server dies.
      - name: h2spec over h2c and over TLS
        run: tests/h2spec/run.sh ./h2spec ./zig-out/bin/full

  autobahn:
    name: Autobahn (WebSocket conformance, HTTP/1.1)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: autobahn
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Build the echo peer
        timeout-minutes: 19
        run: zig build autobahn-echo -Doptimize=ReleaseSafe --summary all
      # The fuzzing client in Docker (image pinned by digest); fails on any
      # case that is not OK, NON-STRICT or INFORMATIONAL.
      - name: Autobahn fuzzing client
        timeout-minutes: 23
        run: tests/autobahn/run.sh ./zig-out/bin/autobahn-echo
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  h3:
    name: HTTP/3 server and client against aioquic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: h3
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # Debug, so the debug allocator reports any leak at exit.
      - name: Build the HTTP/3 test server and client
        timeout-minutes: 17
        run: zig build h3-test-server h3-test-client --summary all
      - name: Server and client against aioquic
        run: tests/h3/run.sh ./zig-out/bin/h3-test-server ./zig-out/bin/h3-test-client
      - name: Build examples/full
        run: zig build full --summary all
      - name: SIGUSR2 restarts with HTTP/3, under a stand-in for systemd's notify socket
        run: tests/restart/run.sh ./zig-out/bin/full

  quic-interop:
    name: QUIC interop runner (Anole's server, ngtcp2 and quic-go clients)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: quic-interop
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The runner reads its traces with pyshark and wants tshark 4.5.0 or
      # newer: the Wireshark nightly PPA (its own CI's source), else the
      # packages of the last good install kept in the cache (a weekly key),
      # else no tshark: the interop steps are skipped with a warning (#54).
      - name: tshark packages of the last good install
        id: tshark-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (v6.1.0)
        with:
          path: ~/tshark-debs
          key: tshark-debs-${{ runner.os }}-${{ steps.tshark-week.outputs.week }}
          restore-keys: tshark-debs-${{ runner.os }}-
      - name: Install tshark
        id: tshark
        timeout-minutes: 10
        run: tests/interop/install-tshark.sh ~/tshark-debs
      - name: tests/interop/run.sh
        if: steps.tshark.outputs.available == 'true'
        timeout-minutes: 20
        run: tests/interop/run.sh ngtcp2,quic-go
        env:
          ANOLE_INTEROP_WORK: ${{ runner.temp }}/interop
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
        with:
          name: quic-interop-logs
          path: ${{ runner.temp }}/interop/logs
          retention-days: 7

  webtransport-interop:
    name: WebTransport interop runner (Anole's server, flupke; Chrome and Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: webtransport-interop
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The runner reads its traces with pyshark and wants tshark 4.5.0 or
      # newer: the Wireshark nightly PPA (its own CI's source), else the
      # packages of the last good install kept in the cache (a weekly key),
      # else no tshark: the interop steps are skipped with a warning (#54).
      - name: tshark packages of the last good install
        id: tshark-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (v6.1.0)
        with:
          path: ~/tshark-debs
          key: tshark-debs-${{ runner.os }}-${{ steps.tshark-week.outputs.week }}
          restore-keys: tshark-debs-${{ runner.os }}-
      - name: Install tshark
        id: tshark
        timeout-minutes: 10
        run: tests/interop/install-tshark.sh ~/tshark-debs
      - name: tests/interop/webtransport/run.sh flupke-webtransport
        if: steps.tshark.outputs.available == 'true'
        timeout-minutes: 21
        run: tests/interop/webtransport/run.sh flupke-webtransport
        env:
          ANOLE_INTEROP_WORK: ${{ runner.temp }}/wt-interop
      # Not a gate yet: the browser images have not been run against Anole
      # (they are x86_64 only, and were built on an arm64 Mac).
      - name: tests/interop/webtransport/run.sh chrome,firefox
        if: steps.tshark.outputs.available == 'true'
        continue-on-error: true
        run: tests/interop/webtransport/run.sh chrome,firefox
        env:
          ANOLE_INTEROP_WORK: ${{ runner.temp }}/wt-interop-browsers
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
        with:
          name: webtransport-interop-logs
          path: |
            ${{ runner.temp }}/wt-interop/logs
            ${{ runner.temp }}/wt-interop-browsers/logs
          retention-days: 7

  templates:
    name: anole new templates (${{ matrix.os }}; build, test, openapi, lint)
    strategy:
      fail-fast: false
      matrix:
        # macOS builds the minimal template only (the full profile is the
        # slow part of the Linux run).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # rest-postgres runs its database tests against this server on Linux.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: templates-${{ matrix.os }}
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The goldens of tests/openapi must be valid OpenAPI 3.1.
      - name: Lint the golden documents
        run: |
          python3 -m venv "$RUNNER_TEMP/oav"
          "$RUNNER_TEMP/oav/bin/pip" install --quiet openapi-spec-validator==0.7.1
          "$RUNNER_TEMP/oav/bin/openapi-spec-validator" tests/openapi/*.json
      - name: Every template (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 48
        run: DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres ANOLE_TEST_TIMEOUT=120s tests/templates/run.sh
      - name: The minimal template (macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 37
        run: ANOLE_TEST_TIMEOUT=120s tests/templates/run.sh minimal
      # The service container (GitHub removes it after the job).
      - name: Container logs and states
        if: failure() && runner.os == 'Linux'
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}

  cli:
    name: anole command line (cross-build of the release binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: cli
      # Std only: no C library is fetched. The five targets include Windows.
      - name: cli-test and cli-dist
        timeout-minutes: 16
        run: zig build cli-test cli-dist -Dprofile=minimal --test-timeout 120s
      - name: The files a release gets
        run: ls -l zig-out/dist && cat zig-out/dist/SHA256SUMS

  consumer:
    name: A project that adds Anole with zig fetch (fresh cache)
    # The commit must be fetchable from this repository, so pushes only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Retried for the same occasional NameServerFailure in Zig's own
      # git fetches; a real failure fails all three runs.
      - name: tests/consumer/run.sh
        timeout-minutes: 30
        run: for i in 1 2 3; do tests/consumer/run.sh "git+https://github.com/${{ github.repository }}#${{ github.sha }}" && exit 0; sleep $((i * 10)); done; exit 1
        env:
          ANOLE_CONSUMER_FRESH_CACHE: "1"

  fuzz:
    name: Fuzz the parsers (200K runs per target)
    runs-on: ubuntu-latest
    timeout-minutes: 92
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: fuzz
      - uses: ./.github/actions/install-gdb
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The fuzz targets are the "fuzz:" tests (src/fuzz.zig, and the HTTP
      # core's: the PROXY protocol, requests through llhttp whole and in
      # pieces, a connection's bytes over HTTP/1.1 and HTTP/2); a plain
      # `zig build test` runs them on their seeds and fixed mutations only.
      - name: zig build test --fuzz=200K
        timeout-minutes: 88
        run: zig build test -Dllvm=true --fuzz=200K --test-timeout 120s

  grpc-interop:
    name: gRPC interop (both directions with grpc-go, h2c and TLS; grpc's HTTP/2 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: grpc-interop
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then (NameServerFailure,
      # HttpConnectionClosing), so the fetch is retried before building.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (v7.0.0)
        with:
          go-version: stable
      - name: Build the interop server
        timeout-minutes: 20
        run: zig build grpc-interop-server -Doptimize=ReleaseSafe --summary all
      # grpc-go's interop client (v1.84.0), one test case at a time.
      - name: Build the interop client
        run: zig build grpc-interop-client -Doptimize=ReleaseSafe --summary all
      - name: Interop test cases (grpc-go client, Anole server)
        run: tests/grpc/interop/run.sh ./zig-out/bin/grpc-interop-server
      - name: Interop test cases (Anole client, grpc-go server)
        run: tests/grpc/interop/run-client.sh ./zig-out/bin/grpc-interop-client
      # The same cases over TLS, with a certificate made for the run.
      - name: Interop test cases over TLS (grpc-go client, Anole server)
        run: tests/grpc/interop/run.sh --tls ./zig-out/bin/grpc-interop-server
      - name: Interop test cases over TLS (Anole client, grpc-go server)
        run: tests/grpc/interop/run-client.sh --tls ./zig-out/bin/grpc-interop-client
      # grpc's tools/http2_interop (pinned): framing over h2c and TLS, and
      # the TLS profile; tool-side failures are listed in
      # tests/grpc/interop/http2-known-failures.txt.
      - name: grpc HTTP/2 server checks
        run: tests/grpc/interop/run-http2.sh ./zig-out/bin/grpc-interop-server

  # ---- p3/grpc-h3 ----
  grpc-h3-interop:
    name: gRPC over HTTP/3 interop (grpc-dotnet v2.84.0 client and server, Anole native and C ABI servers)
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: grpc-h3-interop
      # Zig fetches git and tarball dependencies itself on a cold cache;
      # the runners' network fails now and then, so the fetch is retried.
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The image (.NET 10 SDK, libmsquic, grpc-dotnet's interop programs)
      # takes about 4-6 minutes to build; run.sh builds Anole's side for it.
      - name: gRPC over HTTP/3 against grpc-dotnet
        timeout-minutes: 32
        env:
          ANOLE_GRPC_H3_WORK: ${{ runner.temp }}/grpc-h3
          ANOLE_KEEP_CONTAINERS: "1"
        run: tests/grpc/h3/run.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
        with:
          name: grpc-h3-logs
          path: ${{ runner.temp }}/grpc-h3/logs
          retention-days: 7
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids
  # ---- end p3/grpc-h3 ----

  redis:
    name: Redis and Valkey (live client, session store and rate limiter tests, plain and TLS; the C ABI's suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:7", "valkey/valkey:8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: redis
      - uses: ./.github/actions/install-gdb
      # Zig fetches git dependencies itself on a cold cache, and its DNS
      # lookups fail now and then on the runners (NameServerFailure).
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # A service container takes no files, and the TLS run needs the
      # server's certificate: the script starts the server itself, with a
      # CA made for the run.
      - name: Tests against a live server
        timeout-minutes: 35
        run: REDIS_IMAGE=${{ matrix.image }} tests/redis/run.sh --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  # ---- p3/s3 ----
  s3:
    name: S3 (the client against MinIO, plain and TLS; fuzz target; the C ABI's storage tests)
    runs-on: ubuntu-latest
    timeout-minutes: 81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: s3
      - uses: ./.github/actions/install-gdb
      # Zig fetches git dependencies itself on a cold cache, and its DNS
      # lookups fail now and then on the runners (NameServerFailure).
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # The fake server tests (no Docker: "s3: ..." and "capi s3: ..."), the
      # XML reader's fuzz target ("fuzz: s3 xml") on its seeds, then the same
      # suite plus the live tests against a throwaway MinIO (the image is
      # pinned by digest in the script), once over HTTP and once over TLS.
      - name: Tests against a live server
        timeout-minutes: 35
        run: tests/s3/run.sh --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids
      - name: Fuzz the XML reader
        timeout-minutes: 69
        run: 'zig build test -Dtest-filter="fuzz: s3 xml" -Dllvm=true --fuzz=200K --test-timeout 120s'
  # ---- end p3/s3 ----

  postgres:
    name: PostgreSQL (live client tests, plain and verify-full TLS, scram-sha-256; the C ABI's suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:17"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: postgres
      - uses: ./.github/actions/install-gdb
      # Zig fetches git dependencies itself on a cold cache, and its DNS
      # lookups fail now and then on the runners (NameServerFailure).
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # A service container takes no files, and the TLS run needs the
      # server's certificate: the script starts the server itself, with a
      # CA made for the run.
      - name: Tests against a live server
        timeout-minutes: 35
        run: PG_IMAGE=${{ matrix.image }} tests/postgres/run.sh --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  nats:
    name: NATS (live client and JetStream tests)
    runs-on: ubuntu-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix:
        image: ["nats:2.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: nats
      - uses: ./.github/actions/install-gdb
      # Zig fetches git dependencies itself on a cold cache, and its DNS
      # lookups fail now and then on the runners (NameServerFailure).
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Tests against a live server
        timeout-minutes: 39
        run: NATS_IMAGE=${{ matrix.image }} tests/nats/run.sh --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  kafka:
    name: Kafka (live client tests)
    runs-on: ubuntu-latest
    timeout-minutes: 47
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: kafka
            image: apache/kafka:4.1.0
          - flavor: redpanda
            image: redpandadata/redpanda:v25.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: kafka
      - uses: ./.github/actions/install-gdb
      # Zig fetches git dependencies itself on a cold cache, and its DNS
      # lookups fail now and then on the runners (NameServerFailure).
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      - name: Tests against a live broker
        timeout-minutes: 43
        run: KAFKA_FLAVOR=${{ matrix.flavor }} KAFKA_IMAGE=${{ matrix.image }} tests/kafka/run.sh --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  mongodb:
    name: MongoDB (live client tests; the C ABI's suite)
    # MongoDB 8.0.21+ and 9.x exit at startup on Linux kernels 6.19 to
    # 7.0.13 (SERVER-125742; ubuntu-24.04 runs 7.0.0), and earlier 8.0s
    # crash there: 8.0 and 9.0 run on ubuntu-22.04 (kernel 6.8) until the
    # newer image's kernel reaches 7.0.14.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "mongo:7.0", os: ubuntu-latest }
          - { image: "mongo:8.0", os: ubuntu-22.04 }
          - { image: "mongo:9.0", os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: mongodb-${{ matrix.os }}
      - uses: ./.github/actions/install-gdb
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # A replica set of one with authentication and failCommand, plain and
      # over TLS on a CA made for the run; SCRAM-SHA-256 and SCRAM-SHA-1.
      - name: Tests with a live server
        timeout-minutes: 35
        run: tests/mongodb/run.sh ${{ matrix.image }} --test-timeout 120s
        env:
          ANOLE_KEEP_CONTAINERS: "1"
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids

  smtp:
    name: "SMTP (live tests against Mailpit: plain, STARTTLS with AUTH, implicit TLS)"
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: smtp
      - uses: ./.github/actions/install-gdb
      - name: Fetch dependencies (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 5)); done; exit 1
      # Three Mailpit servers, one plain, one that requires STARTTLS and one
      # with TLS on connect, the last two on a CA made for the run; what was
      # sent is read back from each one's API. The image is pinned by digest
      # (MAINTAINING.md lists the pins and how to bump them).
      - name: Tests against live servers
        timeout-minutes: 35
        env:
          # v1.32.0
          MAILPIT_IMAGE: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
          ANOLE_KEEP_CONTAINERS: "1"
        run: tests/smtp/run.sh --test-timeout 120s
      - name: Container logs and states
        if: failure()
        uses: ./.github/actions/docker-logs
        with:
          name: containers-${{ github.job }}-${{ strategy.job-index }}
      - name: Remove the containers
        if: always()
        run: ids=$(docker ps -aq --filter name=^anole-); [ -z "$ids" ] || docker rm -f $ids
