name: Container logs
description: >-
  After a failure, before any container is removed: every container's log
  (docker logs -t) and state (docker inspect: exit code, OOMKilled, health)
  into an artifact kept 7 days. Use with `if: failure()`.
inputs:
  name:
    description: The artifact's name (unique per job and matrix entry).
    required: true
runs:
  using: composite
  steps:
    - name: Collect the logs and states
      shell: bash
      run: |
        out="$RUNNER_TEMP/container-logs"
        mkdir -p "$out"
        docker ps -a > "$out/docker-ps.txt" 2>&1 || true
        ids=$(docker ps -aq 2>/dev/null || true)
        if [ -z "$ids" ]; then echo "no containers left to collect"; exit 0; fi
        for id in $ids; do
          name=$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null | tr -d '/')
          name=${name:-$id}
          docker logs -t "$id" > "$out/$name.log" 2>&1 || true
          docker inspect -f '{{json .State}}' "$id" > "$out/$name.state.json" 2>&1 || true
          echo "$name: $(cat "$out/$name.state.json")"
        done
    - name: Upload them
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (v7.0.2)
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/container-logs
        retention-days: 7
        if-no-files-found: ignore
