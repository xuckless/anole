<!doctype html>
<title>h2count driver</title>
<body>
<script>
// Browser-side traffic for tools/h2count: /drive?s=<scenario>. The page does
// what a user's tabs do (load, reload, navigate away, cancel, stream) so the
// browser's own HTTP/2 stack produces the frames.
const s = new URLSearchParams(location.search).get('s');
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = (src) => new Promise(r => { const f = document.createElement('iframe'); f.src = src; f.onload = () => r(f); document.body.append(f); });
async function drain(res) { const rd = res.body.getReader(); while (!(await rd.read()).done); }
const jobs = {
  async load() { for (let i = 0; i < 3; i++) { const f = await frame('/?load=' + i); await wait(500); f.remove(); } },
  async reload() { // 30 page loads cut off after 20-120 ms: their streams are reset
    for (let i = 0; i < 30; i++) { const f = document.createElement('iframe'); f.src = '/?reload=' + i; document.body.append(f); await wait(20 + (i * 37) % 100); f.remove(); }
  },
  async abort() { // reads cancelled mid-body, and requests dropped before the answer
    const ps = [];
    for (let i = 0; i < 8; i++) ps.push((async () => { const c = new AbortController(); const r = await fetch('/download?i=' + i, { signal: c.signal }); const rd = r.body.getReader(); await rd.read(); await rd.read(); c.abort(); })().catch(() => {}));
    for (let i = 0; i < 40; i++) { const c = new AbortController(); fetch('/slow?i=' + i, { signal: c.signal }).catch(() => {}); setTimeout(() => c.abort(), 30 + i * 3); }
    await Promise.all(ps); await wait(500);
  },
  async sse() { const es = [0, 1, 2].map(i => new EventSource('/sse?i=' + i)); await wait(2500); es.forEach(e => e.close()); await wait(300); },
  async upload() { await drain(await fetch('/upload', { method: 'POST', body: new Blob([new Uint8Array(16 << 20)]) })); },
  async download() { await drain(await fetch('/download?full=1')); },
  async nav() { fetch('/download?nav=1').then(drain).catch(() => {}); await wait(400); location.href = '/r/1?away'; await wait(3000); },
};
(jobs[s] || (async () => {}))().then(() => { document.title = 'done'; });
</script>
