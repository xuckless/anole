// Anole's JSON transcoding test service: one method per google.api.http
// form (verbs, path templates, body and response_body selection).
syntax = "proto3";

package transcode;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Shade {
  SHADE_UNSPECIFIED = 0;
  LIGHT = 1;
  DARK = 2;
}

message Author {
  string name = 1;
  int32 born = 2;
}

message Book {
  string name = 1;
  string title = 2;
  int64 pages = 3;
  Shade shade = 4;
  repeated string tags = 5;
  Author author = 6;
  bool available = 7;
  google.protobuf.Timestamp published = 8;
  double score = 9;
  bytes token = 10;
  oneof edition {
    string isbn = 11;
    int32 printing = 12;
  }
}

message GetBookRequest {
  string name = 1;
  string view = 2;
  Shade shade = 3;
  repeated string tags = 4;
  Author author = 5;
  int64 revision = 6;
  bool full = 7;
  double score = 8;
  google.protobuf.Timestamp since = 9;
  bytes token = 10;
  repeated int32 pages = 11;
  uint64 big = 12;
}

message CreateBookRequest {
  string parent = 1;
  Book book = 2;
  string book_id = 3;
}

message UpdateBookRequest {
  Book book = 1;
  string mask = 2;
}

message ListBooksRequest {
  string parent = 1;
  int32 page_size = 2;
  string fail = 3;
}

message ListBooksResponse {
  repeated Book books = 1;
  string next_page_token = 2;
}

message Empty {}

service Library {
  // Two bindings: a resource name with literals, and a short form.
  rpc GetBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/{name=shelves/*/books/*}"
      additional_bindings { get: "/v1/books/{name}" }
      additional_bindings { get: "/v1/authors/{author.name}/books" }
    };
  }
  // body: a named field; the rest from the query.
  rpc CreateBook(CreateBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{parent=shelves/*}/books"
      body: "book"
    };
  }
  // A nested field in the path, inside the body field.
  rpc UpdateBook(UpdateBookRequest) returns (Book) {
    option (google.api.http) = {
      patch: "/v1/{book.name=shelves/*/books/*}"
      body: "book"
      additional_bindings { put: "/v1/{book.name=shelves/*/books/*}" body: "*" }
    };
  }
  // response_body: the repeated field alone, as a JSON array. The second
  // binding has a variable where another route has one of another name.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=shelves/*}/books"
      response_body: "books"
      additional_bindings { get: "/v1/authors/{parent}/shelf" }
    };
  }
  rpc DeleteBook(GetBookRequest) returns (Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=shelves/*/books/*}"
    };
  }
  // A custom verb, after a variable; body "*".
  rpc PublishBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{name=shelves/*/books/*}:publish"
      body: "*"
    };
  }
  // A custom verb after a variable, on the route of GetBook's /v1/books/{name}.
  rpc StatBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/books/{name}:stat"
    };
  }
  // A custom verb after a literal.
  rpc BatchGet(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/books:batchGet"
    };
  }
  // ** in a variable, and an anonymous *.
  rpc GetFile(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/files/*/{name=**}"
    };
  }
  // ** with a verb after it.
  rpc GetFileInfo(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/info/{name=**}:stat"
    };
  }
  // A custom HTTP method.
  rpc SearchBooks(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      custom: { kind: "SEARCH" path: "/v1/books" }
      body: "*"
    };
  }
  // Server streaming: one JSON array.
  rpc WatchBooks(ListBooksRequest) returns (stream Book) {
    option (google.api.http) = {
      get: "/v1/{parent=shelves/*}/books:watch"
    };
  }
  // Client streaming is not transcoded: 501.
  rpc UploadBooks(stream Book) returns (Book) {
    option (google.api.http) = {
      post: "/v1/books:upload"
      body: "*"
    };
  }
  // Not annotated: no REST route.
  rpc Plain(GetBookRequest) returns (Book);
}

// The OpenAPI document's test service: field behavior, comments, deprecated,
// oneof, maps, well-known types, and the Connect / transcoded / streaming forms.

// Paint colours.
enum Color {
  // Not set.
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

// A widget.
message Widget {
  // The widget's resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string etag = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string secret = 3 [(google.api.field_behavior) = INPUT_ONLY];
  string old = 4 [deprecated = true];
  int32 count = 5;
  uint32 ucount = 6;
  int64 big = 7;
  uint64 ubig = 8;
  double ratio = 9;
  bytes blob = 10;
  bool on = 11;
  Color color = 12;
  repeated string labels = 13;
  map<string, int32> scores = 14;
  google.protobuf.Timestamp created = 15;
  google.protobuf.Duration ttl = 16;
  google.protobuf.StringValue nick = 17;
  oneof pick {
    string a = 18;
    int32 b = 19;
  }
  optional int32 maybe = 20;
}

message GetWidgetRequest {
  string name = 1;
}

message ListWidgetsRequest {
  int32 page_size = 1;
  repeated string filter = 2;
}

message ListWidgetsResponse {
  repeated Widget widgets = 1;
}

// Widgets of the shop.
service Widgets {
  // Gets a widget.
  //
  // It must exist.
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option (google.api.http) = {
      get: "/v1/{name=widgets/*}"
    };
  }
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = {
      get: "/v1/widgets"
    };
  }
  rpc Peek(GetWidgetRequest) returns (Widget) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Make(Widget) returns (Widget);
  rpc Watch(GetWidgetRequest) returns (stream Widget) {
    option (google.api.http) = {
      get: "/v1/watch/{name}"
    };
  }
  rpc Upload(stream Widget) returns (Empty);
}
