syntax = "proto3";

package greeter;

// Anole's addProtoGen puts google/api/*.proto on the include path.
import "google/api/annotations.proto";

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply) {
    option (google.api.http) = { get: "/v1/hello/{name}" };
  }
}
