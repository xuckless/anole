# The shared Postgres every $12 run uses (bench/postgres/run.sh). It gets
# its own cpuset and 4 GB, apart from the server under test, and the same
# settings for every framework.
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 400
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 512MB
wal_buffers = 64MB
checkpoint_timeout = 15min
max_wal_size = 8GB
synchronous_commit = on
random_page_cost = 1.1
log_min_messages = warning
log_min_error_statement = error
log_checkpoints = off
