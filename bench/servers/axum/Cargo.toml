[package]
name = "axum-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["http2", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# HTTP/3
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "0.23.46"

# gRPC
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"

# $12 challenge
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
