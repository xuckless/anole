[package]
name = "vc-axum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
wtransport = "0.7.2"
rustls = "0.23.46"
getrandom = "0.3"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
