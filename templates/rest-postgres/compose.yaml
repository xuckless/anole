# Postgres for development: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{name}}
    ports:
      - "5432:5432"
    volumes:
      # Runs on the first start of an empty database.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
